<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="AZC Studios is an independent software studio building consumer apps that respect the people who use them. Makers of RecallGuard."
    />
    <meta name="author" content="AZC Studios LLC" />
    <link rel="canonical" href="https://azcstudios.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AZC Studios" />
    <meta property="og:url" content="https://azcstudios.com/" />
    <meta property="og:title" content="AZC Studios" />
    <meta
      property="og:description"
      content="An independent software studio building consumer apps that respect the people who use them."
    />
    <!-- Absolute URL required — scrapers don't resolve relative paths. -->
    <meta property="og:image" content="https://azcstudios.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="AZC Studios — software that earns its place on your phone."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AZC Studios" />
    <meta
      name="twitter:description"
      content="An independent software studio building consumer apps that respect the people who use them."
    />
    <meta name="twitter:image" content="https://azcstudios.com/og.png" />

    <!-- Fonts: Fraunces (display) + Inter (body/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>AZC Studios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
